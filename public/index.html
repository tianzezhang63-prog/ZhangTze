<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121a31"><title>同频词语 | 双人默契游戏</title>
<style>:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#f5f7ff;background:#10172c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#2c385d,#10172c 66%)}main{max-width:510px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;letter-spacing:2px;margin:16px 0 8px}h2{font-size:23px;margin:9px 0 20px}p,.muted{color:#b9c5df;line-height:1.7}.eyebrow{font-size:12px;font-weight:bold;letter-spacing:3px;color:#79e8db}.card{background:#1b2642;border:1px solid #364665;border-radius:24px;padding:23px;margin:18px 0;box-shadow:0 15px 35px #070c1a55}input{width:100%;background:#111b33;border:1px solid #425477;border-radius:13px;color:#fff;padding:17px;font:inherit;font-size:17px;outline:none;margin:7px 0 14px}input:focus{border-color:#79e8db}button{background:#80e4d7;border:0;border-radius:13px;color:#10172c;padding:15px 18px;font-weight:800;font-size:16px;width:100%;cursor:pointer;margin:7px 0}button.secondary{color:#eef3ff;background:#38486d}button:disabled{opacity:.5}#game{display:none}.players,.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player,.answer{padding:18px 8px;text-align:center;background:#253353;border-radius:16px;overflow-wrap:anywhere}.player small,.answer small{display:block;color:#b7c6e6;margin-bottom:12px}.answer strong{font-size:24px}.tag{color:#80e4d7}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.history{border-bottom:1px solid #344361;padding:13px 0;display:grid;grid-template-columns:42px 1fr 1fr 24px;gap:10px;overflow-wrap:anywhere}.history span:first-child{color:#a8b8d7}.history span:last-child{text-align:right;color:#80e4d7}.hidden{display:none!important}.big{font-size:40px;color:#80e4d7;text-align:center}.center{text-align:center}#message{min-height:25px;color:#ffb9bd;font-size:14px}footer{text-align:center;color:#8497bc;font-size:12px;margin-top:35px}</style></head><body><main>
<header><div class="eyebrow">✦ TWO MINDS · ONE WORD</div><div style="font-size:24px">✧</div></header><h1>同频词语</h1><p>两个大脑，一个答案。你们能在第几轮想到同一个词？</p>
<section id="home"><div class="card"><label>你的名字</label><input id="name" maxlength="18" placeholder="输入昵称"><button id="create">✦ 创建双人房间</button></div><div class="card"><label>加入好友房间</label><input id="roomInput" maxlength="6" placeholder="6 位房间码" autocapitalize="characters"><button class="secondary" id="join">加入房间 →</button></div></section>
<section id="game"><div class="card"><div class="row"><div><div class="eyebrow">房间码</div><h2 id="roomCode"></h2></div><div class="center"><div class="eyebrow">ROUND</div><h2 id="roundNumber">01</h2></div></div><div class="players"><div class="player"><small id="p0">玩家一</small><b id="s0">未提交</b></div><div class="player"><small id="p1">玩家二</small><b id="s1">未提交</b></div></div><button id="share" class="secondary">分享房间邀请链接</button></div>
<div id="phaseText" class="eyebrow center"></div><div class="card center" id="playArea"></div>
<div class="card"><div class="row"><h2>历史揭晓</h2><span id="historyCount" class="muted"></span></div><div id="historyRows"></div></div><button id="exit" class="secondary">退出当前房间</button></section><p id="message"></p><footer>秘密提交 · 同步揭晓 · 一致通关</footer></main>
<script>
const $=id=>document.getElementById(id);let cred=null,st=null,events=null,busy=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('name').value=localStorage.getItem('name')||'';$('roomInput').value=new URLSearchParams(location.search).get('room')||'';
function msg(s){$('message').textContent=s;setTimeout(()=>$('message').textContent='',5000)}
async function post(route,data){const r=await fetch('/api/'+route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
async function enter(route){try{if(busy)return;busy=true;const name=$('name').value.trim()||'玩家';localStorage.setItem('name',name);cred=await post(route,{name,code:$('roomInput').value.trim().toUpperCase()});localStorage.setItem('session',JSON.stringify(cred));connect()}catch(e){msg(e.message)}finally{busy=false}}
function connect(){events?.close();$('home').classList.add('hidden');$('game').style.display='block';const qs=new URLSearchParams(cred);events=new EventSource('/api/events?'+qs);events.onmessage=e=>{st=JSON.parse(e.data);render()};events.onerror=()=>{$('phaseText').textContent='正在重新连接…'};fetch('/api/state?'+qs).then(r=>r.json()).then(s=>{if(s.error)throw Error(s.error);st=s;render()}).catch(e=>msg(e.message))}
async function act(route,more={}){if(busy)return;busy=true;try{await post(route,{...cred,...more})}catch(e){msg(e.message)}finally{busy=false}}
function render(){if(!st)return;$('roomCode').textContent=st.code;$('roundNumber').textContent=String(st.round).padStart(2,'0');st.players.forEach((p,i)=>{$('p'+i).textContent=p?.name||'等待加入';$('s'+i).textContent=p?(p.submitted?'✓ 已提交':'等待提交'):'尚未加入'});const a=$('playArea');if(!st.players[1]){$('phaseText').textContent='等待另一位玩家';a.innerHTML='<div class="big">✧</div><h2>邀请另一位玩家加入</h2><p>把链接发给好友，或告诉对方房间码 '+esc(st.code)+'</p>'}
else if(st.phase==='writing'){$('phaseText').textContent='第 '+st.round+' 轮 · 秘密输入';a.innerHTML=st.players[st.seat].submitted?'<div class="big">✓</div><h2>已锁定你的词语</h2><p>对方提交前，任何人都看不到对方的答案。</p>':'<div class="eyebrow">NO PEEKING</div><h2>你想到了什么词？</h2><p>两人输入相同词语就通关</p><form id="wordForm"><input id="word" maxlength="32" required placeholder="输入一个词语" autocomplete="off"><button>秘密提交 ↗</button></form>';const f=$('wordForm');if(f)f.onsubmit=e=>{e.preventDefault();act('submit',{word:$('word').value.trim()})}}
else{const {words,matched}=st.reveal;$('phaseText').textContent=matched?'✦ 完美同频':'本轮揭晓';a.innerHTML='<div class="big">'+(matched?'✦':'↝')+'</div><h2>'+(matched?'你们通关了！':'答案不同，继续寻找共同频率')+'</h2><div class="answers"><div class="answer"><small>'+esc(st.players[0].name)+'</small><strong>'+esc(words[0])+'</strong></div><div class="answer"><small>'+esc(st.players[1].name)+'</small><strong>'+esc(words[1])+'</strong></div></div><p>'+(matched?'恭喜在第 '+st.round+' 轮默契通关！':'双方都准备后进入下一轮')+'</p>'+(matched?'<button id="restart">重新开局</button>':'<button id="next" '+(st.players[st.seat].ready?'disabled':'')+'>'+(st.players[st.seat].ready?'已准备，等待对方':'准备下一轮 →')+'</button>');if($('next'))$('next').onclick=()=>act('next');if($('restart'))$('restart').onclick=exit}
$('historyCount').textContent=st.history.length+' 轮';$('historyRows').innerHTML=st.history.length?st.history.slice().reverse().map(h=>'<div class="history"><span>#'+h.round+'</span><b>'+esc(h.words[0])+'</b><b>'+esc(h.words[1])+'</b><span>'+(h.matched?'✓':'×')+'</span></div>').join(''):'<p>提交第一轮后，历史答案会在这里显示。</p>'}
function exit(){events?.close();localStorage.removeItem('session');cred=null;st=null;$('game').style.display='none';$('home').classList.remove('hidden');history.replaceState({},'',location.pathname)}
$('create').onclick=()=>enter('create');$('join').onclick=()=>enter('join');$('exit').onclick=exit;$('share').onclick=async()=>{const url=location.origin+'/?room='+st.code;try{if(navigator.share)await navigator.share({title:'同频词语',url});else{await navigator.clipboard.writeText(url);msg('邀请链接已复制')}}catch{msg(url)}};
try{let s=JSON.parse(localStorage.getItem('session'));if(s?.code&&s?.token){cred=s;connect()}}catch{}
</script></body></html>
